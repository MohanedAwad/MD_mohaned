<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="./">
  <title>MD Viewer</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header id="toolbar">
    <div class="group">
      <button data-cmd="toggleOutline" data-icon="outline" data-label="Outline" title="Outline  ⇧⌘O"></button>
      <button data-cmd="toggleEditor" data-icon="editor" data-label="Editor" title="Editor  ⌘E"></button>
      <button data-cmd="toggleSync" data-icon="sync" data-label="Sync" title="Sync scroll with the editor"></button>
    </div>
    <div id="crumb"><span id="crumb-dir"></span><span id="crumb-name">MD Viewer</span><span id="dirty-dot" hidden></span></div>
    <div class="group">
      <button data-cmd="find" data-icon="find" title="Find  ⌘F"></button>
      <button data-cmd="copy" data-icon="copy" title="Copy Markdown  ⇧⌘C"></button>
      <button data-cmd="print" data-icon="pdf" title="Export PDF  ⌘P"></button>
      <button data-cmd="cycleTheme" id="btn-theme" data-icon="auto" title="Theme: Auto"></button>
      <button data-cmd="open" data-icon="open" title="Open  ⌘O"></button>
    </div>
  </header>
  <div id="banner" hidden>
    <span>The file changed on disk while you were editing.</span>
    <button id="banner-reload">Use disk version</button>
    <button id="banner-keep">Keep mine</button>
  </div>
  <div id="main">
    <nav id="outline"><div class="side-title">Contents</div><div id="outline-list"></div></nav>
    <section id="editor-pane" hidden></section>
    <section id="preview">
      <div id="progress"></div>
      <div id="search" hidden>
        <input id="search-input" type="search" placeholder="Find in document" spellcheck="false" dir="auto">
        <span id="search-count"></span>
        <button data-step="-1" title="Previous  ⇧↩">↑</button>
        <button data-step="1" title="Next  ↩">↓</button>
        <button data-close title="Close  Esc">✕</button>
      </div>
      <article id="doc" class="md"></article>
      <div id="empty">
        <div class="empty-mark">M↓</div>
        <h1>MD Viewer</h1>
        <p>Open a Markdown file with <kbd>⌘O</kbd>, drop one here, or press <kbd>⌥⇧P</kbd> in Zed.</p>
        <p dir="rtl">افتح ملف Markdown بالضغط على <kbd>⌘O</kbd> أو اسحبه إلى هنا، أو اضغط <kbd>⌥⇧P</kbd> في Zed.</p>
      </div>
    </section>
  </div>
  <footer id="status">
    <span id="st-words"></span>
    <span id="st-read"></span>
    <span id="st-heads"></span>
    <span class="grow"></span>
    <span id="st-updated"></span>
  </footer>
</body>
</html>
