<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="./">
  <title>MD Viewer</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header id="toolbar">
    <button id="project-btn" data-cmd="switchProject"><span id="project-name">No project</span></button>
    <div class="group">
      <button data-cmd="toggleSidebar" data-icon="sidebar"></button>
      <button data-cmd="toggleEditor" data-icon="editor" data-label="Editor"></button>
      <button data-cmd="toggleSync" data-icon="sync" data-label="Sync"></button>
    </div>
    <div id="crumb" dir="auto"><span id="crumb-path"></span><span id="dirty-dot" hidden></span></div>
    <div class="group">
      <button data-cmd="goToFile" data-icon="find" data-label="Go to file"></button>
      <button data-cmd="palette" data-icon="command"></button>
      <button data-cmd="copyMarkdown" data-icon="copy"></button>
      <button data-cmd="exportPDF" data-icon="pdf"></button>
      <button data-cmd="cycleTheme" id="btn-theme" data-icon="auto"></button>
    </div>
  </header>
  <div id="banner" hidden>
    <span>The file changed on disk while you were editing.</span>
    <button id="banner-reload">Use disk version</button>
    <button id="banner-keep">Keep mine</button>
  </div>
  <div id="main">
    <aside id="sidebar">
      <div class="side-tabs">
        <button data-cmd="showFiles" data-panel="files" data-icon="files" data-label="Files"></button>
        <button data-cmd="showOutline" data-panel="outline" data-icon="outline" data-label="Outline"></button>
        <button data-cmd="showBoth" data-panel="both" data-icon="both"></button>
      </div>
      <section id="files-panel" class="side-panel">
        <div class="side-head"><span>Files</span><span id="files-count"></span></div>
        <input id="files-filter" type="search" placeholder="Filter files" spellcheck="false" dir="auto">
        <div id="tree" class="side-scroll"></div>
      </section>
      <section id="outline-panel" class="side-panel">
        <div class="side-head"><span>Outline</span></div>
        <div id="outline-list" class="side-scroll"></div>
      </section>
    </aside>
    <section id="editor-pane" hidden></section>
    <section id="preview">
      <div id="progress"></div>
      <div id="search" hidden>
        <input id="search-input" type="search" placeholder="Find in document" spellcheck="false" dir="auto">
        <span id="search-count"></span>
        <button data-step="-1" title="Previous  ⇧↩">↑</button>
        <button data-step="1" title="Next  ↩">↓</button>
        <button data-close title="Close  Esc">✕</button>
      </div>
      <article id="doc" class="md"></article>
      <div id="empty">
        <div class="empty-mark">M↓</div>
        <h1 id="empty-title">MD Viewer</h1>
        <p id="empty-text"></p>
        <div id="empty-keys"></div>
      </div>
    </section>
  </div>
  <footer id="status">
    <span id="st-words"></span>
    <span id="st-read"></span>
    <span id="st-heads"></span>
    <span class="grow"></span>
    <span id="st-updated"></span>
  </footer>
</body>
</html>
