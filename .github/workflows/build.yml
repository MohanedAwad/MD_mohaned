name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web

  build-windows:
    needs: test-web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm install --prefix windows
      - run: npm run dist --prefix windows
      - uses: actions/upload-artifact@v4
        with:
          name: md-mohaned-windows
          path: |
            build/windows/*.exe
            build/windows/*.msi

  build-macos:
    needs: test-web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: ./scripts/build.sh stable
      - run: ditto -c -k --sequesterRsrc --keepParent "build/MD_mohaned.app" "build/MD_mohaned-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: md-mohaned-macos
          path: build/MD_mohaned-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/md-mohaned-windows/*
            artifacts/md-mohaned-macos/*
